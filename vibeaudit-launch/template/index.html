<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link rel="preload" href="fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/jetbrains-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/jetbrains-mono-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="styles.css" />
<script src="vendor/gsap.min.js"></script>
<script>window.VA_CFG = { ar: "16x9", mode: "main", root: "main" };</script>
</head>
<body data-ar="16x9">
<div id="stage" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
  <section id="hook" class="layer"></section>
  <section id="report" class="layer">
    <div class="col">
      <div class="term-line"></div>
      <h1 class="title"></h1>
      <div class="status"></div>
      <h2 class="section"></h2>
      <article class="card hero" data-issue="2"></article>
      <article class="card compact" data-issue="1"></article>
      <article class="card compact" data-issue="3"></article>
      <article class="card compact" data-issue="5"></article>
      <article class="card compact" data-issue="6"></article>
      <article class="card compact" data-issue="7"></article>
      <article class="card loop" data-issue="4"></article>
    </div>
  </section>
  <section id="close" class="layer"></section>
  <section id="cta" class="layer"></section>
  <div id="wordmark"></div>
  <div id="url-overlay"></div>
</div>
<script src="timeline.js"></script>
</body>
</html>
